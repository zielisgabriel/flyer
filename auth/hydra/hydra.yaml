version: v2.3.0

dsn: ${DSN:memory}

serve:
  public:
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
    tls:
      enabled: false
  admin:
    host: 0.0.0.0
    port: 4445

urls:
  self:
    issuer: http://localhost:4444/
    public: http://localhost:4444/
    admin: http://localhost:4445/
  consent: http://localhost:3000/consent
  login: http://localhost:3000/login
  logout: http://localhost:3000/logout
  error: http://localhost:3000/error
  post_logout_redirect: http://localhost:3000/login
  identity_provider:
    url: http://kratos:4434/admin
    publicUrl: https://kratos/public

secrets:
  system:
    - MTQ3ZTU1NTRiNzk3ZjFjM2E3ZTYxNzc2

oidc:
  subject_identifiers:
    supported_types:
      - pairwise
      - public
    pairwise:
      salt: f7a241127b76ea41742a840e18e32b13811260932d281ebb5ff99f1e36932110

ttl:
  login_consent_request: 1h
  access_token: 15m
  refresh_token: 720h # 30 days
  id_token: 1h
  auth_code: 10m

oauth2:
  expose_internal_errors: true
  # Enable refresh token rotation to security
  grant:
    jwt:
      jti_optional: true

strategies:
  access_token: opaque

log:
  level: debug
  format: text